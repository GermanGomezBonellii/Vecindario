<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f7f3">
  <title>Vecindario</title>
  <script>
    try {
      const savedTheme=localStorage.getItem('vecindario-theme');
      document.documentElement.dataset.theme=savedTheme==='night'?'dark':savedTheme==='sunset' && localStorage.getItem('vecindario.unlock.sunset')==='true'?'sunset':'light';
    } catch (_) {}
  </script>
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body class="modal-open">
  <div id="app" class="app" data-phase="day">
    <header class="topbar">
      <div class="brand-wrap">
        <h1 class="brand" id="brand">VECINDARIO</h1>
        <span class="seed-label" id="seedLabel" hidden></span>
      </div>
      <div class="statusbar" data-copy-aria="aria.status">
        <div class="status-item"><span class="status-kicker" data-copy="labels.level"></span><strong id="levelValue">1</strong></div>
        <div class="status-item"><span class="status-kicker" data-copy="labels.points"></span><strong id="scoreValue">0</strong></div>
        <div class="status-item"><span class="status-kicker" data-copy="labels.lives"></span><strong id="livesValue">● ● ●</strong></div>
        <button class="status-item time-status theme-toggle" id="timeStatus" type="button" data-copy-aria="aria.night"><span class="status-kicker" data-copy="labels.environment"></span><strong id="timeValue">☼ CLARO</strong></button>
        <button id="logicToggle" class="logic-toggle" type="button" aria-expanded="false" aria-controls="debugPanel" data-copy-aria="aria.logic">∑ <span data-copy="labels.logic"></span></button>
        <div class="language-switch" role="group" data-copy-aria="aria.language">
          <button type="button" data-language="es" data-copy-aria="aria.es" aria-pressed="true">ES</button>
          <span aria-hidden="true">/</span>
          <button type="button" data-language="en" data-copy-aria="aria.en" aria-pressed="false">EN</button>
        </div>
        <button id="soundToggle" class="icon-button" type="button" aria-pressed="true" data-copy-aria="aria.sound">◒</button>
      </div>
    </header>

    <main class="layout">
      <section class="board-shell" data-copy-aria="aria.board">
        <div class="board-frame">
          <svg id="board" class="board" viewBox="0 0 1000 700" role="img" data-copy-aria="aria.map"></svg>
          <div class="compass" data-copy-aria="aria.compass">
            <span class="compass-n">N</span>
            <span class="compass-e">E</span>
            <span class="compass-s">S</span>
            <span class="compass-o" data-copy="labels.west"></span>
            <span class="compass-dot"></span>
          </div>
          <div id="phaseToast" class="phase-toast" hidden>
            <strong id="phaseToastTitle" data-copy="night.title"></strong>
            <span id="phaseToastText" data-copy="night.text"></span>
          </div>
        </div>
      </section>

      <aside class="panel" data-copy-aria="aria.panel">
        <section class="case-card">
          <div class="case-head">
            <span class="eyebrow" data-copy="labels.investigation"></span>
            <span id="modeBadge" class="mode-badge">LÓGICA PURA</span>
          </div>
          <p id="casePrompt" class="case-prompt" aria-live="polite"></p>
          <blockquote id="testimony" class="testimony" hidden></blockquote>
        </section>

        <section class="action-card" data-copy-aria="aria.actions">
          <div class="selected-row">
            <span class="eyebrow" data-copy="labels.selected"></span>
            <span id="selectedState" class="selected-state" data-copy="labels.none"></span>
          </div>
          <div class="action-grid">
            <button id="interrogateBtn" class="action primary" type="button" disabled data-copy="actions.interrogate"></button>
            <button id="suspectBtn" class="action" type="button" disabled data-copy="actions.suspect"></button>
            <button id="clearBtn" class="action" type="button" disabled data-copy="actions.clear"></button>
            <button id="accuseBtn" class="action danger" type="button" disabled data-copy="actions.accuse"></button>
          </div>
          <button id="hintBtn" class="hint-button" type="button"><span data-copy="actions.help"></span> <span>−5000</span></button>
          <button id="buyLifeBtn" class="hint-button" type="button"><span data-copy="actions.buyLife"></span> <span>−3000</span></button>
        </section>

        <section class="legend" data-copy-aria="aria.legend">
          <div><i class="swatch swatch-unasked"></i><span data-copy="labels.unaskedLegend"></span></div>
          <div><i class="swatch swatch-asked"></i><span data-copy="labels.askedLegend"></span></div>
          <div><i class="swatch swatch-suspect"></i><span data-copy="labels.suspectLegend"></span></div>
          <div><i class="swatch swatch-cleared"></i><span data-copy="labels.clearedLegend"></span></div>
        </section>
      </aside>
    </main>

    <div id="startModal" class="modal-backdrop">
      <section class="modal start-modal" role="dialog" aria-modal="true" aria-labelledby="startTitle">
        <span class="eyebrow" id="startLevelLabel"></span>
        <p><strong data-copy="intro.headline"></strong><br><span data-copy="intro.rule"></span></p>
        <h2 id="startTitle" data-copy="intro.title"></h2>
        <p data-copy="intro.support"></p>
        <div class="mode-options">
          <button class="mode-option is-selected" type="button" data-mode="normal">
            <strong data-copy="intro.normal"></strong>
            <span data-copy="intro.normalHelp"></span>
          </button>
          <button class="mode-option" type="button" data-mode="assist">
            <strong data-copy="intro.assist"></strong>
            <span data-copy="intro.assistHelp"></span>
          </button>
        </div>
        <button id="startBtn" class="modal-primary" type="button" data-copy="intro.start"></button>
      </section>
    </div>

    <div id="accuseModal" class="modal-backdrop" hidden>
      <section class="modal compact" role="dialog" aria-modal="true" aria-labelledby="accuseTitle">
        <span class="eyebrow" data-copy="labels.accusation"></span>
        <h2 id="accuseTitle" data-copy="accusation.title"></h2>
        <p data-copy="accusation.support"></p>
        <div class="modal-actions">
          <button id="cancelAccuseBtn" class="modal-secondary" type="button" data-copy="accusation.back"></button>
          <button id="confirmAccuseBtn" class="modal-primary danger-fill" type="button" data-copy="accusation.confirm"></button>
        </div>
      </section>
    </div>

    <div id="endModal" class="modal-backdrop" hidden>
      <section class="modal end-modal" role="dialog" aria-modal="true" aria-labelledby="endTitle">
        <span class="eyebrow" id="endEyebrow" hidden></span>
        <h2 id="endTitle"></h2>
        <p id="endMessage"></p>
        <p id="endReveal" data-copy="defeat.reveal" hidden></p>
        <div class="end-stats">
          <div><strong id="endScore">0</strong></div>
          <div><strong id="endQuestions">0</strong></div>
          <div><strong id="endLives">0</strong></div>
        </div>
        <div class="modal-actions stacked-mobile">
          <button id="retryBtn" class="modal-secondary" type="button" data-copy="defeat.retry"></button>
          <button id="newGameBtn" class="modal-primary" type="button" data-copy="defeat.next"></button>
        </div>
      </section>
    </div>

    <div id="shopModal" class="modal-backdrop" hidden>
      <section class="modal shop-modal" role="dialog" aria-modal="true" aria-labelledby="shopTitle">
        <span class="eyebrow" data-copy="shop.eyebrow"></span>
        <h2 id="shopTitle" data-copy="shop.title"></h2>
        <p data-copy="shop.intro"></p>
        <div class="shop-wallet"><span data-copy="shop.balance"></span><strong id="shopBalance" aria-live="polite"></strong></div>
        <div class="shop-items">
          <article class="shop-item"><span class="shop-life-art" aria-hidden="true">●</span><h3 data-copy="shop.life"></h3><p data-copy="shop.lifeHelp"></p><strong id="shopLives"></strong><button id="shopLifeBtn" class="modal-secondary" type="button"></button></article>
          <article class="shop-item"><div class="sunset-swatch" aria-hidden="true"></div><h3 data-copy="shop.sunset"></h3><p data-copy="shop.sunsetHelp"></p><button id="shopSunsetBtn" class="modal-secondary" type="button"></button></article>
        </div>
        <p id="shopStatus" aria-live="polite"></p>
        <div class="shop-themes" role="group" data-copy-aria="shop.themes">
          <button type="button" data-shop-theme="day" data-copy="shop.day" aria-pressed="false"></button>
          <button type="button" data-shop-theme="night" data-copy="shop.night" aria-pressed="false"></button>
          <button type="button" data-shop-theme="sunset" data-copy="shop.sunset" aria-pressed="false"></button>
        </div>
        <p class="shop-credit" data-copy="shop.credit"></p>
        <button id="shopContinueBtn" class="modal-primary" type="button" data-copy="shop.continue"></button>
      </section>
    </div>

    <section id="debugPanel" class="debug-panel" hidden>
      <div class="debug-head">
        <strong><span data-copy="labels.debug"></span> <small data-copy="labels.spoilers"></small></strong>
        <button id="debugClose" type="button" data-copy-aria="aria.close">×</button>
      </div>
      <pre id="debugOutput"></pre>
      <div class="debug-actions">
        <button id="debug100" type="button" data-copy="labels.batch"></button>
        <button id="debugTimed" type="button" data-copy="labels.demo"></button>
      </div>
      <pre id="debugBatchOutput"></pre>
    </section>
  </div>

  <script defer src="./js/app.bundle.js"></script>
</body>
</html>
